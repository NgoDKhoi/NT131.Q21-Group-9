[package]
name    = "autoclaw-core"
version = "0.1.0"
edition = "2021"

[lib]
name       = "autoclaw_core"
crate-type = ["cdylib"]   # Bắt buộc để Maturin build thành .so cho Python

[dependencies]
# PyO3: Python-Rust bridge
pyo3 = { version = "0.21", features = ["extension-module"] }

# Serial port I/O (thay thế pyserial hoàn toàn)
serialport = "4.3.0"

# AI dependencies (dành cho gemini.rs)
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AutoClaw Async Runtime
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
base64 = "0.21"